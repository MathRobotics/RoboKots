[package]
name = "robokots-python"
version = "0.0.1"
edition = "2021"
publish = false
[lib]
name = "_rust_core"
crate-type = ["cdylib"]
[dependencies]
robokots = { path = "../../../robokots-rs", features = ["python"] }
pyo3 = { version = "0.23", features = ["extension-module"] }
[profile.release]
codegen-units = 1
lto = "thin"
