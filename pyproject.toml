[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robokots"
version = "0.0.1"
authors = [  
  { name="taiki-ishigaki", email="taiki000ishigaki@gmail.com" },
]
description = "robotics library"
readme = "README.md"

license = {text = "MIT License"}
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
    "jax>=0.4.30",
    "numpy>=2.0.2",
    "scipy>=1.13.1",
    "mathrobo>=0.0.6",
    "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
table = ["polars>=1.34.0"]
viz = ["matplotlib>=3.9.4"]
test = ["pytest>=8.4.2", "polars>=1.34.0"]
developer = ["pin>=3.4.0"]

[project.urls]
Homepage = "https://github.com/MathRobotics/RoboKots"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["robokots", "robokots.*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.so", "*.pyd", "*.dll", "*.dylib", "Cargo.*", "*.rs"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: slow tests (numerical differentiation, heavy jacobian checks)"]
